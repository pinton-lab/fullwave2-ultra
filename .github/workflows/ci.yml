name: ci
on: [push, pull_request]

jobs:
  leak-guard:                       # blocks any .cu / binary / private artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_no_private.sh

  test:
    runs-on: ubuntu-latest
    needs: leak-guard
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[dev]
      - run: ruff check --select F,E9 --line-length 120 fullwave2_ultra tests examples
      - run: PYTHONPATH=. pytest -q       # CPU gates run; GPU/data/fw2b tests skip cleanly
